# Differences from the oracles that are expected, each with its reason.
#
# A mismatch that matches an entry is reported as expected rather than as a
# regression. `fonts` and `configs` are glob patterns; `kinds` names the
# comparisons the entry covers. Entries are matched once hinted and
# HarfBuzz comparisons land.
#
# status is one of:
#   oracle-bug   the oracle is wrong; skrifa is right
#   by-design    skrifa deliberately differs
#   not-ported   skrifa lacks something the oracle has; it should go away

[[diff]]
id = "ft-autohint-cff-nested-matrix"
oracle = "freetype"
configs = ["*autohint*"]
kinds = ["outline"]
status = "oracle-bug"
reason = """
FreeType's autohinter cannot compute the scale of a CFF font with nested
font matrices, and its output for such fonts is wrong."""

[[diff]]
id = "ft-autohint-diacritics"
oracle = "freetype"
configs = ["auto*", "autolight*"]
kinds = ["outline", "advance"]
status = "not-ported"
reason = """
FreeType 2.14 changed how its autohinter places diacritics, separating
marks from their bases, and autohints mark composites. skrifa's autohinter
follows 2.13: against FreeType 2.13.3 every glyph of the crater set matches
except Noto Serif's U+052A."""

[[diff]]
id = "type1-hinting"
oracle = "freetype"
fonts = ["*-t1", "*-pfb"]
configs = ["native*", "mono*"]
kinds = ["outline"]
status = "not-ported"
reason = """
FreeType hints Type 1 fonts with its PostScript hinter; skrifa does not
hint them yet."""

[[diff]]
id = "ft-harfbuzz-type1-coverage"
oracle = "freetype"
fonts = ["*-t1", "*-pfb"]
configs = ["*-shaped*"]
kinds = ["outline", "advance"]
status = "oracle-bug"
reason = """
Built with HarfBuzz, FreeType's autohinter changes 609 of NimbusSans's 855
glyphs; skrifa's shaping changes none. A Type 1 font has no SFNT tables, so
HarfBuzz likely reads no character map through FreeType and the autohinter
finds no script coverage."""

[[diff]]
id = "line-metric-signs"
oracle = "freetype"
kinds = ["ascender", "descender"]
status = "by-design"
reason = """
skrifa reads ascenders above the baseline and descenders below it whatever
sign a font stores, as HarfBuzz does. FreeType keeps the stored sign."""
